# Lives on the Hetzner box at ~/apps/admin.oylab.uz/docker-compose.yml next to a .env
# (see ../.env.example) and a clone of the repository in ./repo.
services:
  oylab-admin:
    build:
      context: ./repo
      dockerfile: apps/admin/Dockerfile
    container_name: oylab-admin
    restart: unless-stopped
    env_file: .env
    volumes:
      - oylab_admin_data:/data
    networks:
      - caddy_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  oylab_admin_data:

networks:
  caddy_network:
    external: true

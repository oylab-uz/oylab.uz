name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generates cloudflare-env.d.ts (gitignored) so the build can type the bindings.
      - run: pnpm cf-typegen
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
